; Firmware cho board ESP32-3248S035R (3.5"). Xem docs/hardware/esp32-3248s035r.md và ADR 0005.
; Chân màn và cảm ứng khai báo ở build_flags (TFT_eSPI đọc từ đây, không sửa file trong thư viện).

[env:cyd35]
; Phiên bản ghim theo lần build chạy được đầu tiên (2026-11-16): Arduino core 3.3.12.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@2.5.43
upload_port = COM5
monitor_port = COM5
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D USER_SETUP_LOADED=1
    ; Màn ST7796 480x320. LovyanGFX 1.3.0 hiện sai màu trên tấm màn này (ADR 0005).
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    ; Màn và cảm ứng XPT2046 dùng chung bus HSPI.
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    ; Đèn nền GPIO27, mức cao = sáng. Bản 2.8" dùng GPIO21; dùng nhầm thì màn đen.
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; 80MHz: ESP32 chỉ chia được 40 hoặc 80. Đo 2026-11-16: 40MHz đẩy khung mất 43ms (19 fps).
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
